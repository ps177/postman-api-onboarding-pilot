name: Onboard Service to Postman

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: Service project name
        required: true
        default: payment-refund-api
      spec_url:
        description: Raw HTTPS URL of the OpenAPI spec
        required: true
        default: https://raw.githubusercontent.com/ps177/postman-api-onboarding-pilot/main/specs/payment-refund-api-openapi.yaml
      spec_path:
        description: Repo-relative path to the spec
        required: true
        default: specs/payment-refund-api-openapi.yaml
      domain:
        description: Business domain
        required: true
        default: payments
      domain_code:
        description: Short domain code
        required: true
        default: PAY
      environments:
        description: Environments as JSON array
        required: true
        default: '["prod","uat","qa","dev"]'

jobs:
  onboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Onboard service into Postman
        uses: postman-cs/postman-api-onboarding-action@v0
        with:
          project-name: ${{ inputs.project_name }}
          domain: ${{ inputs.domain }}
          domain-code: ${{ inputs.domain_code }}
          requester-email: yugen1793@gmail.com
          spec-url: ${{ inputs.spec_url }}
          spec-path: ${{ inputs.spec_path }}
          environments-json: ${{ inputs.environments }}
          postman-api-key: ${{ secrets.POSTMAN_API_KEY }}
          postman-access-token: ${{ secrets.POSTMAN_ACCESS_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-fallback-token: ${{ secrets.GH_FALLBACK_TOKEN }}
